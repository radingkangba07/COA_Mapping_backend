# =============================================================================
# COA Migration — Demo Environment Nginx Block
#
# Add the upstream block alongside the existing staging/testing upstreams,
# and the two location blocks inside the existing server { } block.
#
# After editing the live nginx.conf, reload with:
#   docker exec <nginx-container> nginx -s reload
# or if nginx runs on the host:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The nginx container must also be connected to the coa-demo network so it
# can resolve the container name coa-demo-api-service-1:
#   docker network connect coa-demo <nginx-container-name>
# =============================================================================

# --- Demo upstream (add alongside staging_api, testing_api) ---
upstream demo_api {
    server coa-demo-api-service-1:8001;
}

# --- Demo location blocks (add inside the server { } block) ---

# /demo/api/ → backend
location /demo/api/ {
    rewrite ^/demo/api/(.*) /api/$1 break;
    proxy_pass http://demo_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# WebSocket upgrade support for /demo/api/v1/ws/ (job stream)
location /demo/api/v1/ws/ {
    rewrite ^/demo/api/v1/ws/(.*) /api/v1/ws/$1 break;
    proxy_pass http://demo_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
