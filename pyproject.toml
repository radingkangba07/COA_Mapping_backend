[project]
name = "coa-migration-api"
version = "3.0.0"
requires-python = ">=3.12"
description = "Chart of Accounts Migration Platform — modular monolith backend"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.25",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.12",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "nats-py>=2.7",
    "boto3>=1.34",
    "rapidfuzz>=3.6",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
]

# Note: dev deps are also declared in [tool.uv] for `uv sync --dev`.
# [project.optional-dependencies] kept for pip backwards compat.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
]

# ── Ruff (replaces black, isort, flake8) ──────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (undefined names, unused imports, redefined)
    "I",     # isort (import ordering)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (no print statements)
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async (async pitfalls)
    "S",     # flake8-bandit (security)
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
]
ignore = [
    "S101",  # allow assert in tests
    "S105",  # allow hardcoded passwords in tests/config
    "S106",  # allow hardcoded passwords in function args
    "B008",  # allow Depends() in function defaults (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S101", "S105", "S106", "T20"]
"src/migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (static type checking — catches errors without running code) ─────────

[tool.mypy]
python_version = "3.12"
strict = false                   # start permissive, tighten over time
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true        # type-check inside untyped functions
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["nats.*", "boto3.*", "botocore.*", "jose.*", "rapidfuzz.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests that need external services (postgres, nats, s3)",
]
