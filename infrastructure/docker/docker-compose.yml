# COA Migration System - Docker Compose
# Local Development Configuration

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: coa-postgres
    environment:
      POSTGRES_USER: coa_user
      POSTGRES_PASSWORD: coa_password
      POSTGRES_DB: coa_migration
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coa_user -d coa_migration"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: coa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    container_name: coa-api
    environment:
      DATABASE_URL: postgresql+asyncpg://coa_user:coa_password@postgres:5432/coa_migration
      DATABASE_URL_SYNC: postgresql://coa_user:coa_password@postgres:5432/coa_migration
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORS_ORIGINS: "*"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Service Worker (disabled by default for local dev)
  ml-service:
    build:
      context: ../services/ml-service
      dockerfile: Dockerfile
    container_name: coa-ml-worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql://coa_user:coa_password@postgres:5432/coa_migration
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 0  # Disabled by default - enable when ready
    profiles:
      - ml  # Use: docker-compose --profile ml up

  # Frontend (for local development)
  frontend:
    build:
      context: ../services/frontend
      dockerfile: Dockerfile
    container_name: coa-frontend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      - api-service

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  default:
    name: coa-network
