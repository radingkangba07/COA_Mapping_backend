services:
  frontend:
    build:
      context: ./frontend
      dockerfile: services/frontend/Dockerfile
      args:
        API_BASE_URL: /test
        APP_ENV: testing
    expose:
      - "80"
    depends_on:
      api-service:
        condition: service_healthy
    restart: always
    networks:
      - coa-testing

  api-service:
    build:
      context: ./backend
      dockerfile: backend/Dockerfile
    expose:
      - "8001"
    env_file:
      - .env.testing
    depends_on:
      mongo:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coa-testing

  mongo:
    image: mongo:7-jammy
    volumes:
      - testing_mongo_data:/data/db
    expose:
      - "27017"
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coa-testing

volumes:
  testing_mongo_data:

networks:
  coa-testing:
    driver: bridge