services:
  frontend:
    build:
      context: ./frontend
      dockerfile: services/frontend/Dockerfile
    expose:
      - "80"
    depends_on:
      api-service:
        condition: service_healthy
    restart: always
    networks:
      - coa-staging

  api-service:
    build:
      context: ./backend/services/api-service
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coa-staging

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env.staging
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coa-staging

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    env_file:
      - .env.staging
    volumes:
      - staging_rabbitmq_data:/var/lib/rabbitmq
    expose:
      - "5672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coa-staging

volumes:
  staging_postgres_data:
  staging_rabbitmq_data:

networks:
  coa-staging:
    driver: bridge