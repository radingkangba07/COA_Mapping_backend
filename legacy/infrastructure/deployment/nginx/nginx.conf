# =============================================================================
# COA Migration — Multi-Environment Nginx Gateway
# Production: /         Staging: /staging/    Testing: /test/
# =============================================================================

# --- Production upstreams ---
upstream prod_frontend {
    server coa-prod-frontend-1:80;
}
upstream prod_api {
    server coa-prod-api-service-1:8001;
}

# --- Staging upstreams ---
upstream staging_frontend {
    server coa-staging-frontend-1:80;
}
upstream staging_api {
    server coa-staging-api-service-1:8001;
}

# --- Testing upstreams ---
upstream testing_frontend {
    server coa-testing-frontend-1:80;
}
upstream testing_api {
    server coa-testing-api-service-1:8001;
}

server {
    listen 80;
    server_name 209.38.122.199;

    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # =========================================================================
    # TESTING — http://209.38.122.199/test/
    # =========================================================================
    location /test/api/ {
        rewrite ^/test/api/(.*) /api/$1 break;
        proxy_pass http://testing_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /test/ {
        rewrite ^/test/(.*) /$1 break;
        proxy_pass http://testing_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # STAGING — http://209.38.122.199/staging/
    # =========================================================================
    location /staging/api/ {
        rewrite ^/staging/api/(.*) /api/$1 break;
        proxy_pass http://staging_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /staging/ {
        rewrite ^/staging/(.*) /$1 break;
        proxy_pass http://staging_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # PRODUCTION — http://209.38.122.199/
    # =========================================================================
    location /api/ {
        proxy_pass http://prod_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location / {
        proxy_pass http://prod_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}