# .github/workflows/deploy-backend.yml
# Copy to: COA_Mapping_backend_V0/.github/workflows/deploy-backend.yml

name: Deploy Backend

on:
  push:
    branches:
      - feat/project-crud-endpoints
      - staging
      - develop
    paths:
      - 'services/api-service/**'

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "feat/project-crud-endpoints" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=testing" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 209.38.122.199
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/coa-migration
            ./deploy.sh ${{ steps.env.outputs.environment }} backend