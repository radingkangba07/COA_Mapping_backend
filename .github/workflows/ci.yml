name: CI

on:
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: /tmp/.uv-cache
  DATABASE_URL: "postgresql+asyncpg://coa_user:coa_pass@localhost:5432/coa_migration_test"
  JWT_SECRET: "ci-test-secret-not-for-production"
  JWT_ALGORITHM: "HS256"
  NATS_URL: ""
  S3_ENDPOINT: ""
  APP_NAME: "coa-migration"
  DEBUG: "true"
  CORS_ORIGINS: "*"

jobs:
  # ── Lint & Type Check (fast, no DB needed) ────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint (catches import errors, undefined names, bad syntax)
        run: uv run ruff check src/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format src/ --check --diff

      - name: Mypy static type check (catches type errors at compile time)
        run: uv run mypy src/ --ignore-missing-imports

  # ── Tests (needs PostgreSQL) ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coa_user
          POSTGRES_PASSWORD: coa_pass
          POSTGRES_DB: coa_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coa_user -d coa_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest src/tests/ -v --tb=short --junitxml=test-results.xml -x

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ── Migration Check (verify migrations are up to date) ────────────────────
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coa_user
          POSTGRES_PASSWORD: coa_pass
          POSTGRES_DB: coa_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coa_user -d coa_migration_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://coa_user:coa_pass@localhost:5432/coa_migration_check"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for unapplied model changes
        run: |
          uv run alembic check 2>&1 || {
            echo "::error::Models have changes not captured in migrations. Run: alembic revision --autogenerate -m 'description'"
            exit 1
          }
