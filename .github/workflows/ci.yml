name: CI

on:
  pull_request:
    branches: [main, develop, "feat/**"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_PYTHON: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  DATABASE_URL: "postgresql+asyncpg://coa_user:coa_pass@localhost:5432/coa_migration_test"
  JWT_SECRET: "ci-test-secret-not-for-production"
  JWT_ALGORITHM: "HS256"
  NATS_URL: ""
  S3_ENDPOINT: ""
  APP_NAME: "coa-migration"
  DEBUG: "true"
  CORS_ORIGINS: '["*"]'

jobs:
  # ── Lint & Type Check (fast, no DB needed) ────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Debug secret availability
        run: |
          if [ -z "${{ secrets.GH_PAT_COA_DB_MODELS }}" ]; then
            echo "::error::GH_PAT_COA_DB_MODELS secret is EMPTY"
            exit 1
          else
            echo "GH_PAT_COA_DB_MODELS is set (length: ${#TOKEN})"
          fi
        env:
          TOKEN: ${{ secrets.GH_PAT_COA_DB_MODELS }}

      - name: Configure git for private dependencies
        run: git config --global url."https://${{ secrets.GH_PAT_COA_DB_MODELS }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package coa-db-models

      - name: Ruff lint (catches import errors, undefined names, bad syntax)
        run: uv run ruff check src/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format src/ --check --diff

      - name: Mypy static type check (catches type errors at compile time)
        run: uv run mypy src/ --ignore-missing-imports

  # ── Tests (needs PostgreSQL) ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    environment: testing
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: coa_user
          POSTGRES_PASSWORD: coa_pass
          POSTGRES_DB: coa_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coa_user -d coa_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure git for private dependencies
        run: git config --global url."https://${{ secrets.GH_PAT_COA_DB_MODELS }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: uv sync --dev --upgrade-package coa-db-models

      - name: Run tests
        run: uv run pytest src/tests/ -v --tb=short --junitxml=test-results.xml -x

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

