    products: [quickbooks]
  sage:
    name: Sage
    products: [sage, pastel]
  xero:
    name: Xero
    products: [xero]
  odoo:
    name: Odoo
    products: [odoo]
  zoho:
    name: Zoho
    products: [zoho]

