<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); text-align: center; max-width: 400px; }
    .icon { font-size: 48px; color: #22c55e; margin-bottom: 16px; }
    h1 { color: #111; font-size: 24px; }
    p { color: #666; margin-top: 8px; }
    a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Email Verified</h1>
    <p>{{ message }}</p>
    <p style="margin-top:24px"><a href="/">Go to app</a></p>
  </div>
</body>
</html>
